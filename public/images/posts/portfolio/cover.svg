<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- grid de fundo -->
  <g stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="120" y1="0" x2="120" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="520" y1="0" x2="520" y2="720"/><line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="920" y1="0" x2="920" y2="720"/><line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- janela de terminal principal -->
  <g>
    <rect x="70" y="90" width="1140" height="440" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="70" y="90" width="1140" height="46" rx="14" fill="#1e293b" fill-opacity="0.7"/>
    <rect x="70" y="120" width="1140" height="16" fill="#1e293b" fill-opacity="0.7"/>
    <line x1="70" y1="136" x2="1210" y2="136" stroke="#334155" stroke-width="1.5"/>
    <circle cx="104" cy="113" r="7" fill="#f87171" fill-opacity="0.85"/>
    <circle cx="128" cy="113" r="7" fill="#facc15" fill-opacity="0.85"/>
    <circle cx="152" cy="113" r="7" fill="#4ade80" fill-opacity="0.85"/>
    <text x="640" y="119" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" fill="#64748b">jeff@portfolio — zsh</text>

    <g font-family="'JetBrains Mono',Consolas,monospace" font-size="19">
      <text x="110" y="186" fill="#4ade80">$</text>
      <text x="134" y="186" fill="#22d3ee">~/portfolio</text>
      <text x="290" y="186" fill="#e2e8f0">ls ~/projetos</text>

      <text x="110" y="228" fill="#64748b">drwxr-xr-x  6  jeff  staff  2048  projeto-financas</text>
      <text x="110" y="262" fill="#64748b">drwxr-xr-x  4  jeff  staff  2048  console-do-jeff</text>
      <text x="110" y="296" fill="#64748b">drwxr-xr-x  3  jeff  staff  2048  meu-ponto</text>
      <text x="110" y="330" fill="#64748b">drwxr-xr-x  5  jeff  staff  2048  Onda</text>

      <text x="110" y="386" fill="#4ade80">$</text>
      <text x="134" y="386" fill="#22d3ee">~/portfolio</text>
      <text x="290" y="386" fill="#e2e8f0">cat ~/blog/recentes.md</text>

      <text x="110" y="428" fill="#94a3b8"># Astro · Tailwind · TypeScript — site estático</text>
      <text x="110" y="462" fill="#94a3b8"># GitHub API + RSS do blog consumidos no build</text>
      <text x="110" y="496" fill="#94a3b8"># deploy gratuito no GitHub Pages</text>

      <text x="110" y="540" fill="#4ade80">$</text>
      <text x="134" y="540" fill="#22d3ee">~/portfolio</text>
      <text x="290" y="540" fill="#e2e8f0">git push</text>
      <text x="382" y="540" fill="#4ade80">✓</text>
      <text x="404" y="540" fill="#94a3b8">deploy concluído</text>
    </g>
  </g>

  <!-- barra inferior de status -->
  <g font-family="'JetBrains Mono',Consolas,monospace">
    <rect x="70" y="566" width="1140" height="52" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
    <text x="100" y="598" font-size="16" fill="#4ade80">●</text>
    <text x="122" y="598" font-size="16" fill="#94a3b8">GitHub Pages</text>
    <text x="290" y="598" font-size="16" fill="#22d3ee">●</text>
    <text x="312" y="598" font-size="16" fill="#94a3b8">Astro</text>
    <text x="392" y="598" font-size="16" fill="#22d3ee">●</text>
    <text x="414" y="598" font-size="16" fill="#94a3b8">TypeScript</text>
    <text x="540" y="598" font-size="16" fill="#22d3ee">●</text>
    <text x="562" y="598" font-size="16" fill="#94a3b8">Tailwind CSS</text>
    <text x="700" y="598" font-size="16" fill="#facc15">●</text>
    <text x="722" y="598" font-size="16" fill="#94a3b8">RSS</text>
    <text x="1170" y="598" font-size="16" fill="#4ade80" text-anchor="end">❯</text>
  </g>

  <text x="70" y="672" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#475569">PORTFÓLIO · SITE ESTÁTICO · ASTRO</text>
</svg>
